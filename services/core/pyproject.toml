[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xinyu-core"
version = "0.1.0"
description = "Local-first core service for the Xinyu desktop companion."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "sqlite-vec>=0.1.6,<1",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=13,<17",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.14,<7",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
]

[project.scripts]
xinyu-core = "xinyu_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xinyu_core"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
